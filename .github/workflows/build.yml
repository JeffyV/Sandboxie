name: Build x64

# Standalone x64 build pipeline: compiles the Sandboxie core, Sandboxie-Plus,
# SbieShell and SandboxieTools, merges them and uploads the installable package
# as a workflow artifact.
#
# Triggered only for the "dev" branch (push + pull request), plus manual runs.
#
# Version numbers (Qt, OpenSSL, ...) are intentionally NOT hard-coded here.
# They are read from Installer\buildVariables.cmd so this workflow stays in sync
# with the rest of the build system.

on:
  workflow_dispatch:

  push:
    branches: [dev]
    paths-ignore:
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.github/FUNDING.yml'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/announcements.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/codespell.yml'
      - '.github/workflows/hash.yml'
      - '.github/workflows/lupdate.yml'
      - '.github/workflows/main.yml'
      - '.github/workflows/main_old.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/update_copyright.yml'
      - '.github/workflows/winget.yml'
      - '**/*.md'
      - '**/*.html'
      - '**/*.png'
      - '**/*.bmp'
      - '**/LICENSE*'
      - '**/license*'
      - '**/README*'
      - '**/ReadMe*'
      - '**/INSTALL*'
      - '**/AUTHORS'
      - '**/COPYING'

  pull_request:
    branches: [dev]
    paths-ignore:
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.github/FUNDING.yml'
      - '.github/dependabot.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/announcements.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/codespell.yml'
      - '.github/workflows/hash.yml'
      - '.github/workflows/lupdate.yml'
      - '.github/workflows/main.yml'
      - '.github/workflows/main_old.yml'
      - '.github/workflows/stale.yml'
      - '.github/workflows/update_copyright.yml'
      - '.github/workflows/winget.yml'
      - '**/*.md'
      - '**/*.html'
      - '**/*.png'
      - '**/*.bmp'
      - '**/LICENSE*'
      - '**/license*'
      - '**/README*'
      - '**/ReadMe*'
      - '**/INSTALL*'
      - '**/AUTHORS'
      - '**/COPYING'

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: build-x64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Build_x64_Qt6:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load Variables from buildVariables.cmd
        shell: cmd
        run: |
          @echo on
          call "${{ github.workspace }}\Installer\buildVariables.cmd" build_qt6
          echo qt6_version=%qt6_version% >> %GITHUB_ENV%
          echo qt_version=%qt_version% >> %GITHUB_ENV%

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v3

      #
      # Compile Sandboxie Core
      #

      - name: Build Sandboxie x86 (DLLs & svc)
        run: msbuild /t:build Sandboxie\SandboxDll.sln /p:Configuration="SbieRelease" /p:Platform=Win32 -maxcpucount:8

      - name: Build Sandboxie x64 (all)
        run: msbuild /t:build Sandboxie\Sandbox.sln /p:Configuration="SbieRelease" /p:Platform=x64 -maxcpucount:8

      - name: Build Sandboxie x64 (drv)
        run: msbuild /t:build Sandboxie\SandboxDrv.sln /p:Configuration="SbieRelease" /p:Platform=x64 -maxcpucount:8

      #
      # Prepare Qt Framework
      #

      - name: Install Qt6 x64
        run: SandboxiePlus\install_qt.cmd x64

      # Jom cache restore (and post-job save on miss)
      - name: Cache jom archive
        id: cache-jom
        uses: actions/cache@v6.1.0
        with:
          path: jom_1_1_4.zip
          key: jom-1.1.4-${{ runner.os }}
          restore-keys: |
            jom-1.1.4-
            jom-
          fail-on-cache-miss: false

      - name: Installing Jom
        shell: cmd
        run: SandboxiePlus\install_jom.cmd

      #
      # Compile Sandboxie Plus
      #

      - name: Build Sandboxie-Plus x64
        run: SandboxiePlus\qmake_plus.cmd x64 build_qt6

      - name: Build SbieShell x64
        run: msbuild /t:restore,build -p:RestorePackagesConfig=true SandboxiePlus\SbieShell\SbieShell.sln /p:Configuration="Release" /p:Platform=x64

      #
      # Compile Sandboxie Tools
      #

      - name: Build Sandboxie-Tools x64
        run: msbuild /t:build SandboxieTools\SandboxieTools.sln /p:Configuration="Release" /p:Platform=x64 -maxcpucount:8

      #
      # Merge everything together
      #

      - name: Add missing languages for Qt6 (issue 1528)
        run: Installer\fix_qt5_languages.cmd x64 build_qt6

      - name: Get openssl binaries
        run: Installer\get_openssl.cmd

      - name: Get 7z binaries
        run: Installer\get_7zip.cmd

      - name: Merging Build
        run: Installer\copy_build.cmd x64 build_qt6

      - name: Collect installer assets
        run: Installer\get_assets.cmd

      #
      # Build the Inno Setup installer (.exe)
      #

      - name: Prepare installer sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          # Sandboxie-Plus.iss reads the assembled build from .\Release\{#MyAppSrc}
          # and expects it to be named SbiePlus64 for the x64 installer.
          New-Item -ItemType Directory -Force -Path 'Installer\Release' | Out-Null
          Copy-Item -Recurse -Force 'Installer\SbiePlus_x64' 'Installer\Release\SbiePlus64'

          # The x64 installer bundles the ImDisk driver. The .iss expects the
          # following two files, which are not part of this repository; they are
          # taken from the ImDisk release used by Sandboxie (see CHANGELOG.md).
          $imdiskZip = Join-Path $env:RUNNER_TEMP 'ImDiskTk64.zip'
          Invoke-WebRequest -Uri 'https://github.com/DavidXanatos/ImDisk/releases/download/v3.0.3/ImDiskTk64.zip' -OutFile $imdiskZip
          $imdiskDir = Join-Path $env:RUNNER_TEMP 'ImDisk'
          Expand-Archive -Path $imdiskZip -DestinationPath $imdiskDir -Force
          $imdiskRoot = Get-ChildItem -Path $imdiskDir -Directory | Select-Object -First 1

          Copy-Item (Join-Path $imdiskRoot.FullName 'files.cab') 'Installer\imdisk_files.cab' -Force
          # install.bat extracts "files.cab"; the .iss ships it as imdisk_files.cab
          (Get-Content (Join-Path $imdiskRoot.FullName 'install.bat') -Raw) -replace 'files\.cab', 'imdisk_files.cab' |
            Set-Content 'Installer\imdisk_install.bat' -Encoding ascii

          # Read the Sandboxie-Plus version from SandboxiePlus\version.h
          $versionHeader = Get-Content 'SandboxiePlus\version.h' -Raw
          function Get-VersionPart([string]$name) {
            [regex]::Match($versionHeader, "(?m)^\s*#define\s+$name\s+(\d+)").Groups[1].Value
          }
          $version = "$(Get-VersionPart 'VERSION_MJR').$(Get-VersionPart 'VERSION_MIN').$(Get-VersionPart 'VERSION_REV')"
          $update = Get-VersionPart 'VERSION_UPD'
          if ([int]$update -gt 0) { $version = "$version.$update" }

          "SBIE_PLUS_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Sandboxie-Plus version: $version"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-ChildItem 'C:\Program Files (x86)\Inno Setup*\ISCC.exe' | Select-Object -First 1).FullName
          }
          Write-Host "Using $iscc"

          # Sandboxie-Plus.iss sets "SignTool=sha256", which makes the compiler
          # abort when no matching sign tool is configured. Inno Setup 6 has no
          # "disable signing" switch and rejects a no-op sign tool ("the file does
          # not have a digital signature"), so the directive is commented out in
          # the ephemeral CI workspace only. CI builds are intentionally unsigned.
          $issPath = Join-Path (Get-Location).Path 'Installer\Sandboxie-Plus.iss'
          $iss = [IO.File]::ReadAllText($issPath)
          $iss = $iss -replace '(?m)^\s*SignTool=sha256.*$', '; SignTool disabled for CI (build is not code-signed)'
          [IO.File]::WriteAllText($issPath, $iss, (New-Object System.Text.UTF8Encoding $true))

          $outDir = Join-Path (Get-Location).Path 'Installer\Release'

          Push-Location 'Installer'
          try {
            & $iscc /Qp "/O$outDir" "-DMyAppVersion=$env:SBIE_PLUS_VERSION" /DMyAppArch=x64 /DMyAppSrc=SbiePlus64 'Sandboxie-Plus.iss'
            if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          Get-ChildItem "$outDir\*.exe" | Format-Table Name, Length

      #
      # Upload artifacts
      #

      - name: Upload installer (exe)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Sandboxie-Plus-Installer-x64
          path: Installer/Release/*.exe
          retention-days: 60

      - name: Upload installer assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Assets
          path: |
            Installer/Assets/*
          retention-days: 60

      - name: Upload Sandboxie x64
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Sandboxie_x64
          path: |
            Installer/SbiePlus_x64/*
          retention-days: 60
